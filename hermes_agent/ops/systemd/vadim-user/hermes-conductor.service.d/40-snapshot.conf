# Pre-run rollback point for autonomous jobs. Added 2026-08-22, when the unit was
# un-parked (it had been renamed to .KEEP-vadim on 2026-08-18 after the dup-conductor
# / gateway-wedge incident, so nothing had loaded these paths since).
#
# WHY A DROP-IN AND NOT THE .env: the base unit loads EnvironmentFile= from
# 3dlook-marketing/.../full_stack_sm/conductor/.env, and that file has no HO_SNAPSHOT_SH.
# The value IS rendered into the OTHER .env — the /srv runtime one — but that file is
# not loaded by this unit, so the variable simply never reached the worker.
#
# WHAT IT BUYS: conductor-snapshot.sh writes refs/hermes/snapshots/job-<id> in whatever
# repo the job runs in, BEFORE the agent touches anything. The conductor's own autocommit
# deliberately skips main/master, and Vadim's marketing work lives on main — so without
# this an autonomous run has no rollback point at all. Job 90 (2026-08-21) ran without it.
#
# Environment= is safe here precisely because the loaded .env does NOT set this key:
# systemd.exec(5) has EnvironmentFile= override Environment=, which is what silently
# defeated this same drop-in's DATABASE_URL line until the .env was made absolute
# (see the comment block in conductor/.env, 2026-08-22).
[Service]
Environment=HO_SNAPSHOT_SH=/srv/vadim_prod/ai-agents-config/agents-ai/telegram-bot-agent/hermes-agent/ops/conductor-snapshot.sh
