# Escalation-callback webhook port. Pinned 2026-08-22.
#
# WHY PIN AN ALREADY-CORRECT VALUE: the loaded .env does not set HO_WEBHOOK_PORT at
# all, so the worker was reaching the right port only through bot-callback.ts's
# hardcoded fallback, and logging this on every start:
#   [webhook] HO_WEBHOOK_PORT="" is not a usable port — falling back to 3001.
# Depending on an upstream default for a per-user port is exactly what that warning
# is complaining about — the day the fallback changes, this runtime moves silently.
#
# WHY 3001 AND NOT 3011: the /srv runtime .env carries the comment "3001 is his
# assigned port (vadim_prod uses 3011)", which reads as though 3011 were Vadim's.
# Measured on the box instead: :3011 is held by the OTHER account's runtime
# (sergiy_prod) and :3001 was free, so the parenthetical is simply wrong and the
# rendered value 3001 is right. No collision — the two accounts do not share a port.
#
# NOTE ON WHAT THIS ENDPOINT ACTUALLY DOES HERE: nothing, currently. bot-callback.ts
# expects the gateway to relay ho:* callback_query updates to POST /telegram-webhook,
# and the claude-switcher patch comment still describes it that way — but the SHIPPED
# gateway handler (gateway/claude_switcher.py handle_conductor_escalation_callback)
# writes the decision straight into ho_escalations via sqlite3 and never makes the HTTP
# call. The conductor then picks the decision up by polling (store.ts waitEscalation).
# So Approve/Deny in Telegram works with this port bound, unbound, or wrong. It is kept
# bound and correct so the relay path stays available, not because it is load-bearing.
[Service]
Environment=HO_WEBHOOK_PORT=3001
Environment=HO_WEBHOOK_HOST=127.0.0.1
