# Deployment-specific paths for the conductor.
#
# WHY A DROP-IN AT ALL: ops/conductor-run.sh is a VENDORED file — `hermes update` overwrites it
# (it did on 2026-08-12 08:49) with the portable upstream version. Pinning the paths here rather
# than in the script keeps the next update from breaking the unit.
#
# 2026-08-26: repointed at THIS repository and away from /srv/vadim_prod/ai-agents-config.
# That tree is Sergiy's system; it is not part of 3dlook-marketing and must not be a runtime
# dependency of it. The conductor source, package.json and node_modules now live here, at
# parity with what was running — source synced, better-sqlite3 in place of the leaking
# @libsql/client, 140 tests green — so the app the unit points at is the app in git.
#
# History of this file, kept because both reversals came from the same class of mistake: it
# once pinned everything to this repo while the canonical copy had no node_modules and
# ~/.hermes/ho.db was an empty schema, so the unit named a tree that could not start, and on
# 2026-08-12 it was repointed at /srv to fix exactly that. Both times the real danger was the
# base unit and the drop-in disagreeing — the running process being one app while the unit
# claimed another. They agree now: the base unit's WorkingDirectory and this one are the same
# path, so a reboot cannot silently resolve a disagreement onto a tree that will not start.
#
# %h is systemd's home-directory specifier. Using it instead of a literal /home/vadim_prod
# keeps the unit portable to a machine where the account is named something else.
#
# Queue state stays in ~/.hermes so it does not travel when a project repo is cloned or cleaned.
[Service]
WorkingDirectory=%h/3dlook-marketing/claude_code/DEV/full_stack_sm/conductor
Environment=CONDUCTOR_DIR=%h/3dlook-marketing/claude_code/DEV/full_stack_sm/conductor
Environment=HERMES_REPO_ROOT=%h/3dlook-marketing
Environment=DATABASE_URL=file:%h/.hermes/ho.db
