# Deployment-specific paths for the conductor.
#
# WHY A DROP-IN AT ALL: ops/conductor-run.sh is a VENDORED file — `hermes update` overwrites it
# (it did on 2026-08-12 08:49) with the portable upstream version. Pinning the paths here rather
# than in the script keeps the next update from breaking the unit.
#
# 2026-08-12: repointed at the CANONICAL tree. This drop-in previously pinned everything to
# ~/3dlook-marketing/claude_code/DEV/full_stack_sm/conductor, for two reasons that were true at
# the time and are not any more:
#   - the canonical copy had no node_modules (npm start → tsx: exit 127) — installed since
#   - ~/.hermes/ho.db was an empty schema — the real queue (77 jobs / 531 runs) was migrated
#     into it, checkpointed, and the idempotent-enqueue index applied
# Leaving it pinned was a live trap: the base unit already pointed at the canonical tree, so the
# two disagreed, and the running process was the old app while the unit claimed otherwise. A
# reboot would have resolved that disagreement on its own, silently, onto a tree that could not
# even start.
#
# The 3dlook-marketing checkout stays exactly where it is — it is his PROJECT, not the runtime.
# Queue state belongs in ~/.hermes so it does not travel when a project repo is cloned or cleaned.
[Service]
WorkingDirectory=/srv/vadim_prod/ai-agents-config/agents-ai/telegram-bot-agent/claude-code-agent/DEV/dev/conductor
Environment=CONDUCTOR_DIR=/srv/vadim_prod/ai-agents-config/agents-ai/telegram-bot-agent/claude-code-agent/DEV/dev/conductor
Environment=HERMES_REPO_ROOT=/srv/vadim_prod/ai-agents-config
Environment=DATABASE_URL=file:/home/vadim_prod/.hermes/ho.db
