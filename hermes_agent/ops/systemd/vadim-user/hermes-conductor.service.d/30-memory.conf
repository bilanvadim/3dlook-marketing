# Memory ceiling for the conductor. Added 2026-08-14, the day it was OOM-killed.
#
# WHAT HAPPENED: at 07:31:56 the kernel fired a GLOBAL oom-kill and chose THIS service — node,
# 8 640 804 kB of anonymous RSS. It was not alone in causing it: the neighbouring account's
# conductor (same code, same bug) held another 5+ GB at that moment, so between them they had
# ~14 of the box's 15 GB and the machine had been swapping for hours.
#
# That swapping is what actually broke hermes-gateway. Its loop-liveness watchdog decided to
# quit at 07:08:16, and the thread then needed until 07:31:56 — 24 minutes — to reach its own
# os._exit(75), with two threads parked inside a plain os.stat(). Note what that means for
# Restart=always/RestartSec=5: the downtime was set by page-fault latency, not by the restart
# delay, so no restart policy could have shortened it.
#
# THE CAUSE IS FIXED IN THE CODE, not here — see store.ts inWriteTx() and the conductor RUNBOOK.
# In short: @libsql/client's local driver hands its connection to every client.transaction() and
# never closes it, so each transaction orphaned one. 33 021 of them, 5.4 GB, accumulated while
# polling an EMPTY queue. Upstream still ships that in 0.17.4.
#
# So this file is the BACKSTOP, not the fix: whatever leaks next must kill this service instead
# of the machine. MemorySwapMax is the line that protects the neighbours — unbounded swap is what
# turned one leaking process into everyone's outage. With it capped, this unit reaches MemoryMax
# and restarts long before the box starts thrashing.
#
# Healthy idle footprint after the fix is ~60-140 MB, so 3G is generous by more than an order of
# magnitude. It is a runaway detector, not a diet.
[Service]
MemoryHigh=2G
MemoryMax=3G
MemorySwapMax=512M
