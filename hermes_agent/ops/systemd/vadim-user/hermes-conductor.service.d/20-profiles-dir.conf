# Where the conductor resolves ho_jobs.profile -> profiles/<name>.json.
#
# WHY: `conductor/src/core/profiles.ts` defaults to `resolve(HERE, '../../../../profiles')`
# — i.e. the profiles dir of whichever tree the worker runs from. 10-deployment-paths.conf
# moved the runtime to /srv/vadim_prod/... on 2026-08-12, and that tree's profiles/ has only
# dev · marketing · sandbox · security · seo · test. It has NO marketing_vb.json and no
# marketing_vb_sm.json — while ho_jobs' CHECK constraint happily accepts both.
#
# The failure mode is silent, which is what makes it worth pinning: a job with
# profile='marketing_vb_sm' passes the constraint, then the worker logs
#   [profiles] no manifest for 'marketing_vb_sm' at <...> — falling back to project settings
# and runs with NONE of the mvb-* plugins. No error, no failed step, nothing visible in
# ho_project_status. It just quietly stops being Vadim's marketing system.
#
# 74 of the 77 jobs in the queue are marketing_vb_sm (67) or marketing_vb (7). None of them
# hit this — they all predate the 2026-08-12 repoint, when the runtime still lived in the
# 3dlook-marketing tree and found its own profiles/. The gap has simply not been exercised
# yet; the next marketing job would have been the first.
#
# The canonical profiles dir carries all 7 manifests. Marketplace paths inside them are
# relative to the profiles dir's PARENT (`devDir` in profiles.ts, same convention as
# switch-profile.sh), so pointing at the canonical dir also repoints every marketplace at
# the 3dlook-marketing tree. Verified 2026-08-14 by replaying the resolver's path logic:
# marketing_vb_sm 12/12 plugin dirs present, marketing_vb 4/4, dev 11/11, seo 7/7,
# marketing 7/7, security 4/4 — 0 missing.
#
# Runtime (code, node_modules, WorkingDirectory) stays in /srv per 10-deployment-paths.conf.
# Only profile RESOLUTION moves. Queue state stays in ~/.hermes/ho.db.
[Service]
Environment=HO_PROFILES_DIR=/home/vadim_prod/3dlook-marketing/claude_code/DEV/profiles
