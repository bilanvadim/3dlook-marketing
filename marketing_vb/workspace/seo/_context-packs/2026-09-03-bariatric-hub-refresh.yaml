  SUPERSEDED_BY_GAP_ANALYSIS:
  - claim: Pre-operative dropout up to 50-60% across bariatric programs
    status: DO NOT REUSE AS-IS — substantiation defect
    detail: 'Appears below in external_citations and icp_context.pain_points because it is on the live

      page. Verification 2026-09-03 found the published range is far wider and measurement-

      dependent: a 2026 narrative review says "as high as 60%", one cohort reports 22.25%,

      Canadian programs with mandatory pre-op pathways complete at ~36-76%, US at ~39-70%, one

      single-centre series 8.9% pre-pandemic. The live page presents the top of the range as

      typical. Guardrail #4 (no bare percentage without methodology) and #1 (substantiation).

      Restate as a range with its variability. See gap analysis §4.

      '
  - claim: 'JAMA Network Open: bariatric surgery use fell 8.7% (2022-2023)'
    status: SUPERSEDED — older, smaller cut of the same story
    detail: 'JAMA Surgery, 13 May 2026 (Calzaretta et al., Analysis Group) reports metabolic bariatric

      surgery utilization -34.1% from 2022 to 2024 with GLP-1 receptor agonist use +140.4% over

      the same period, and the decline continued into 2025. Three volume series are now in play

      and they do not reconcile — see gap analysis §3 for which to use and how to scope each.

      ASMBS national estimate and the JAMA cohort must never share a sentence.

      '
  - claim: ~33M US adults meet eligibility criteria; <1% complete surgery annually (PMC)
    status: CITATION MISMATCH — re-cite or drop
    detail: 'The live page points this at PMC10136401, which is a qualitative attrition paper, not an

      eligibility-prevalence source. The ASMBS 2025 Fact Sheet carries "about 1% of those who

      meet eligibility requirements" directly. ASMBS May 2026 adds the stronger finding that

      90-95% of patients with severe obesity received no treatment during the study period.

      '
