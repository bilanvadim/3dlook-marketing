  icp_context:
    KNOWN_GAP: 'audience.md''s 7 FitXpress health segments do NOT include a Bariatrics layer (only

      Telehealth/GLP-1, UK BMI Verification, Connected Fitness, Wellness Rewards, Insurance

      Underwriting, BCRL/Oncology, Plastic Surgery). Buyer/pain data below is reconstructed from

      icp-detail.md §5 (itself marked in that file as "not covered by the new ICP doc, carried

      over from the previous version") plus about-me.md hard rules plus the live page''s own scope

      note — not from a dedicated audience.md hook / do-not-say layer. FLAG TO VADIM: a canonical

      Bariatrics segment layer is missing from audience.md.

      '
    segment: Bariatric / Metabolic Clinics (Pre-Qualification)
    buyer_persona:
    - Director of Operations
    - Medical Director
    pain_points:
    - Eligibility confirmed too late — consult slots spent on measurement collection, not clinical evaluation
    - Pre-auth packets rely on free-text clinical notes payers cannot independently verify
    - Pre-operative dropout is high and varies widely by program design (see SUPERSEDED_BY_GAP_ANALYSIS
      — do not publish 50-60% as typical); every in-person verification step is a funnel-loss point
    - GLP-1 has widened and complicated the intake funnel without adding surgical capacity
    - Patients increasingly arrive already lighter on a GLP-1, so current BMI and qualifying BMI history
      have come apart — eligibility now turns on dated, verifiable history
    - A 7-day standard pre-auth decision clock (CMS-0057-F, live since 2026-01-01 for impacted payers)
      leaves no room for a request-for-more-information cycle
    - Weight alone does not describe post-op trajectory; composition gets lost without structured tracking
    hero_message: Pre-qualify patients remotely to reduce wasted consults, speed pre-auth, and improve
      conversion to procedures.
    segment_hook: Move the body-measurement step from the consult (stage 3) back to intake (stage 1) —
      one capture asset reused across pre-qual, pre-auth, and post-op tracking.
    do_not_say:
    - Never say FitXpress determines medical eligibility for surgery, diagnoses, or replaces clinical
      evaluation
    - Never imply the scan makes the pre-authorization decision — payer/program review still decides
    - Keep distinct from the GLP-1 Market hub and generic online-pharmacy BMI verification
    - Post-op progress tracking is 'supporting evidence within the program's monitoring workflow', never
      medical advice or a clinical decisioning output
    - Do not answer clinical-care questions (what is bariatric surgery, benefits, side effects, pros and
      cons) — see the checkpoint-1 question in the gap analysis §6b
    published_scope_note: 'Verbatim from the live page (keep; reuse this exact framing for the child articles):

      "Mobile body scanning solutions described in this article do not determine medical eligibility

      for bariatric surgery, provide diagnoses, replace clinical evaluations, or make

      pre-authorization decisions. They produce body measurement and composition data intended as

      supporting evidence within decisioning workflows operated by licensed bariatric programs and

      their compliance and payer counterparts."

      '
  ACCURACY_RULE: Copy sentences verbatim from accuracy-formulations.md. Never reassemble from proof-points.md
    numbers. Never combine the internal benchmark with the ISO benchmark in one paragraph. Link the framework
    article (mobile-body-scanning-accuracy) from the SAME paragraph as any figure — not in a footer block.
  approved_claims:
  - id: FX-001
    text: Internal validation across multiple real-world scan events with five repeated scans per person
      against expert pattern-maker manual measurements shows 3DLOOK's measurement accuracy of approximately
      96-97% across body metrics, with a typical absolute error of 1.5-2.0 cm per measurement, varying
      by body part.
    source: accuracy-formulations.md §1.1
    publishable: true
  - id: FX-002
    text: For most evaluated measurements, repeated scans showed typical scan-to-scan differences of less
      than 1 cm.
    source: accuracy-formulations.md §1.2 (approved repeatability formulation)
    publishable: true
  - id: FX-003
    text: The ISO 8559-1:2017 benchmark, which uses 3D scanner averages as the reference (a different
      reference than the internal pattern-maker comparison), placed 3DLOOK's session-to-session repeatability
      at 0.40 cm. The numbers from the two studies should not be combined because the references differ.
    source: accuracy-formulations.md §1.3
    publishable: true
    note: Separate benchmark — never combine with FX-001/FX-002 in one paragraph. article_lint.py fails
      it.
  - id: FX-004
    text: 95%+ overall repeatability consistency
    source: proof-points.md Repeatability table
    publishable: false
    reason: INTERNAL ONLY. The live framework article describing this same 2025 study gives no such percentage.
      The publishable repeatability claim is FX-002 (< 1 cm).
  - id: FX-005
    text: The internal validation population included participants aged 16-78, heights of 150-220 cm,
      weights of 38-210 kg, and participants from the US and Europe. Performance outside this scope has
      not been characterized.
    source: accuracy-formulations.md §1.4
    publishable: true
  - id: FX-006
    text: 3DLOOK's accuracy claims have not been peer-reviewed or externally validated through a third-party
      clinical study.
    source: accuracy-formulations.md §1.9
    publishable: true
    note: Use when scope/validation comes up. Reserved words (independent, third-party, validated, peer-reviewed)
      are otherwise off-limits about our own evidence.
  - id: FX-007
    text: Two photos, guided capture, results in under 45 seconds; 80+ body measurements plus BMI, BMR,
      body-fat %, lean/fat mass.
    source: proof-points.md Speed / Output coverage
    publishable: true
  - id: FX-008
    text: Weight estimation ±3.5% average error margin (software output, not a scale).
    source: proof-points.md Accuracy; about-me.md canonical figures
    publishable: true
  - id: FX-009
    text: HIPAA-maintained for US healthcare contexts, BAA-ready, GDPR-aligned, AWS S3 SSE-S3 encryption
      at rest, TLS in transit, no personal identifiers processed, photos deleted immediately or within
      a configurable retention window.
    source: proof-points.md Compliance and security; compliance.md
    publishable: true
    caution: 'Do NOT claim SOC 2 certified — compliance.md: ''NOT SOC 2 certified yet (in progress — confirm
      with Vadim before claiming).'''
  - id: FX-010
    text: Bariatric pre-qualification TAM $10-30M/year, SAM (near-term target networks) $2-8M/year.
    source: proof-points.md Market sizing
    publishable: true
    note: Illustrative/internal-deck sizing — not a customer-facing headline stat.
