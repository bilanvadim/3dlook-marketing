  company_oneliner: "3DLOOK turns two smartphone photos into a 3D body model and 80+ body measurements in 45 seconds, via API and SDK."

  product_summary: |
    FitXpress: mobile body scanning producing structured body data (80+ measurements, BMI,
    BMR, body fat %, lean/fat mass, 3D model) from two smartphone photos, delivered primarily
    via API/SDK integration into the customer's own product; the FitXpress Admin Panel is an
    OPTIONAL centralized view (Vadim, 2026-09-21).
    For THIS article: the angle is capture reliability and input-quality controls — how guided,
    standardized capture (pose/tilt validation, clothing detection, retake logic) supports
    remote users completing a usable scan without a technician present, and what that guidance
    does and does not guarantee. NOT an accuracy-validation article, NOT a general "how two
    photos become data" explainer, NOT a patient-engagement or progress-tracking piece, NOT a
    privacy/security/regulatory FAQ, NOT a clinical decision-making guide, NOT another broad
    telehealth overview (telehealth is the primary context, not the subject).

  page_specs:   # brief.md §2, verbatim values
    h1: "FitXpress User Experience and Capture Quality FAQ"
    seo_title: "FitXpress Capture Quality & User Experience FAQ"
    url: "/content-hub/fitxpress-capture-quality-user-experience-faq/"
    content_type: "Canonical product and procurement FAQ"
    funnel_stage: "MOFU/BOFU"
    primary_audience: "Product leaders, clinical operations teams, implementation teams, procurement teams, digital-health executives"
    primary_intent: "Can remote users produce reliable body data without staff supervision?"
    secondary_intent: "How does FitXpress control photo quality, pose, clothing, and capture conditions?"
    meta_description: "Answers for telehealth and digital-health teams about guided photo capture, RTPV, clothing detection, self-scanning, retakes, workflow integration, and timing."

  strategic_role: >
    Canonical source for FitXpress capture-experience and input-quality-control questions.
    Do NOT turn into: another broad telehealth article; a general "how two-photo body
    measurement works" explainer; an accuracy-validation article; a patient-engagement
    article; a progress-tracking article; a privacy/security/regulatory FAQ; a clinical
    decision-making guide. Use concise answers and link to the canonical page when a
    question extends beyond capture quality.

  central_message: >
    Remote capture quality depends on both the technology and the conditions under which the
    user completes the scan. FitXpress uses standardized, guided capture and capture-quality
    controls to reduce avoidable variation — these controls do NOT eliminate the need for
    clear instructions, suitable clothing, appropriate lighting/placement, retake logic,
    accessibility planning, or an alternative route for users who cannot complete the scan.
    Do not claim FitXpress guarantees a successful scan or eliminates all effects of user
    behavior.

  intro_guidance: "~100-150 words. Frame: remote-care/digital-health buyers ask whether users can complete a two-photo scan reliably without a technician present. Introduce FitXpress as guided two-photo body measurement technology embeddable in an existing digital experience. State the FAQ covers UX, capture-quality controls, retakes, self-scanning, workflow integration, timing. Do NOT introduce progress tracking, privacy, or clinical applications in detail here."

  quick_answers_table:   # brief §5, verbatim — a 3-column compact table, does NOT replace full FAQ answers
    - topic: "Photo capture"
      direct_answer: "FitXpress guides the user through front and side photo capture."
      qualification: "Usable results still depend on suitable capture conditions."
    - topic: "Positioning"
      direct_answer: "Real-time pose/tilt validation provides positioning and framing feedback."
      qualification: "A capture-quality control, not a clinical posture assessment."
    - topic: "Clothing"
      direct_answer: "Clothing conditions are checked during the capture process."
      qualification: "Do not claim accurate measurement through every garment."
    - topic: "Self-scanning"
      direct_answer: "Users can complete supported capture flows independently."
      qualification: "Accessibility, available space, and device placement still matter."
    - topic: "Retakes"
      direct_answer: "The experience can direct the user to correct capture problems."
      qualification: "Do not claim every quality problem is automatically detected."
    - topic: "Workflow"
      direct_answer: "Capture can be embedded through web or mobile SDKs and the API."
      qualification: "Clinical interpretation and decisions stay outside FitXpress."
    - topic: "Timing"
      direct_answer: "Results are returned within the approved product timeframe."
      qualification: "Distinguish capture time, processing time, and total flow — only <45s total is approved (see unconfirmed_product_behavior)."

  required_questions:   # all 11, condensed from brief §6 — do not drop any rule
    - n: 1
      q: "How does FitXpress help users capture usable photos?"
      cover: "Front+side capture; standardized instructions; positioning/framing guidance; real-time feedback; SDK flow; consistency across repeated scans."
      note: "Guided capture reduces avoidable variation but does not make capture conditions irrelevant."
      link: "\"how two photos become structured body data\" → /content-hub/3dlook-turns-two-photos-structured-body-data/"
    - n: 2
      q: "What is Real-Time Pose Validation (RTPV)?"
      cover: "Define in full at first use. Operates during capture; checks position/framing against requirements; real-time guidance to adjust; the validation layer within the capture flow."
      must_state: "\"[This] is a capture-quality and positioning control. It does not assess posture as a medical, musculoskeletal, or health condition.\" Never describe as posture analysis, health assessment, motion analysis, or clinical validation."
      implementation_note: "Standardized SDK capture layer supports consistent performance; customer can brand the surrounding UX, capture/tutorial layers are more limited (tech-spec.md 'What's NOT customizable')."
      caution: "See unconfirmed_product_behavior — \"RTPV\" as a named acronym is not attested in canon. Use lowercase descriptive phrasing (\"real-time pose and tilt validation\") and do not present it as an established branded/trademarked term."
    - n: 3
      q: "What happens when a user's position does not meet the capture requirements?"
      cover: "Do not lead with \"wrong posture.\" Cover: repositioning prompts, framing corrections, another attempt where needed, supportive corrective instructions."
      must_not: "State every positioning problem automatically blocks capture (UNCONFIRMED — canon only says pose validation 'reduces retakes', never 'blocks'). No invented rejection thresholds, confidence scores, or error messages."
    - n: 4
      q: "What happens when clothing may affect scan quality?"
      cover: "Tight/body-following clothing supports more consistent capture; oversized/loose/layered/body-obscuring garments affect the visible outline; clothing classification (canon: sport/regular/oversized, tech-spec.md) identifies relevant conditions; flow may direct user to correct clothing or repeat capture."
      must_not: "Measures accurately through any clothing; guarantees detection of every garment issue; \"prevents manipulation\"; automatically rejects every unsuitable scan."
      caution: "\"Clothing Detector\" as a capitalized proper-noun feature name is UNCONFIRMED (see unconfirmed_product_behavior) — write as lowercase descriptive capability, not a branded name."
    - n: 5
      q: "How much do user behavior and capture conditions affect the results?"
      cover: "No invented % reduction from poor behavior. Discuss positioning, framing, camera placement/angle, lighting, distance, clothing, consistency between baseline/follow-up scans. Clearly distinguish accuracy (closeness to reference method) vs repeatability (consistency of repeated scans) vs capture quality (whether submitted images meet processing requirements)."
      evidence: "Use FXS-ACCURACY and FXS-REPEAT VERBATIM (see approved_claims) — NOT the brief's own paraphrase \"approximately 96-97% agreement with expert manual measurements\", which is not the canonical sentence. Always qualify by reference/population/protocol and link mobile-body-scanning-accuracy from that paragraph. Never present as universal guarantees. The two benchmarks (internal vs ISO 8559) are never combined."
      link: "\"body-scanning accuracy framework\" → /content-hub/mobile-body-scanning-accuracy/"
    - n: 6
      q: "What happens if a user cannot complete a valid scan?"
      cover: "Corrective instructions; retakes; a defined support route; accessibility considerations; an assisted/alternative capture path where appropriate; an alternative workflow for users who cannot or prefer not to scan."
      must_not: "Imply remote scanning must be the only way to remain in a healthcare/wellness program. Do not promise every user can complete the scan independently."
      optional_context: "faq.md:72-73 — 'Failed-due-to-pose scans are not billable' is a real, confirmed operational fact but is commercial/billing detail; include only if it fits a buyer-facing register, not required."
    - n: 7
      q: "Can users complete a scan alone at home?"
      cover: "Answer yes, with qualifications. Supported self-scan flow guides front+side capture without a technician or dedicated scanner."
      confirmed: "Standard smartphone; a flat surface for phone placement (tech-spec.md 'Recommended capture environment' — 'Phone placed vertically on a flat surface (table, counter)'); real-time positioning feedback; no specialized scanning hardware."
      caution: "Timer / voice-guided capture is UNCONFIRMED — no canon source (tech-spec.md, how-it-works.md, faq.md) mentions an audio prompt or countdown timer. Omit or write as unconfirmed; do not invent this mechanic."
      also_ack: "Completion can depend on mobility, available space, smartphone access, privacy, ability to follow positioning instructions."
      must_not: "Imply every user or environment is suitable for self-scanning."
    - n: 8
      q: "Can FitXpress be integrated into a telehealth or clinical workflow?"
      cover: "Operational sequence (tech-spec.md Pattern A/B + how-it-works.md): customer embeds guided capture step in its app/web experience → user completes front+side capture → customer backend submits to FitXpress API → FitXpress processes and returns structured outputs → customer stores/displays/routes outputs per its workflow → care team/authorized professional reviews."
      integration_options_confirmed: "Web SDK — Camera SDK (React), described in canon as 'React (web + hybrid)'; native iOS SDK (Swift); native Android SDK (Kotlin); REST API; FitXpress Admin Panel (optional, FXS-DELIVERY)."
      caution: "\"React Native\" specifically is UNCONFIRMED — canon never names it; only 'Camera SDK (React) — React (web + hybrid)'. Do not assert an explicit React Native SDK; safe wording is 'a React-based web SDK' or 'Camera SDK (React), for web and hybrid apps', not 'React Native support'."
      state: "Use FXS-SCOPE (supports clinician/care-team review; does not diagnose, determine treatment, autonomously determine eligibility, or replace a required reference method) and FXS-MEDICAL (\"FitXpress is not a medical device.\") verbatim."
    - n: 9
      q: "How long do capture and processing take?"
      cover: "Separate three concepts: onboarding/preparation; front+side photo capture; processing/delivery of results."
      approved_figure: "ONLY 'under 45 seconds' for the full pipeline is approved (FXS-SPEED / compliance.md §3: 'returns structured outputs in under 45 seconds'). No canon source gives a separate capture-only or processing-only number."
      must_not: "Mix 'under 45 seconds', 'under 40 seconds', 'under one minute', or other timing claims on the same page. Do not claim 'under 10 seconds' — not approved for any production implementation in canon."
    - n: 10
      q: "Can users upload existing photos instead of completing guided capture?"
      cover: "Existing-photo uploads are NOT supported for the standard workflow. Guided capture matters because: the system needs front/side images under defined conditions; pose/tilt validation operates during the supported flow; camera positioning/context contributes to consistency; camera-roll photos don't provide the same controlled capture record."
      confirmed_source: "\"FitXpress controls capture via its SDK, without a camera roll picker, and applies real-time pose and tilt validation.\" (brand-assets/past-articles/blog/online-pharmacy-bmi-verification.md:95); \"Access to the device's camera roll is disabled.\" (same file, line 66)."
      must_not: "Suggest all uploaded photos are fraudulent or manipulated."
    - n: 11
      q: "What progress outputs are available after a successful scan?"
      cover: "Brief bridge ONLY — do not expand into a progress-tracking section. Depending on configuration: body measurements; calculated metrics (BMI, BMR); body-composition estimates (body fat %, fat mass, lean mass); a 3D body model; comparisons between customer-selected scans (Body Progress)."
      guardrail: "Lean mass, never muscle mass. If Body Progress is mentioned, apply body_progress_guardrails below."
      link: "\"mobile body scanning and patient engagement\" → /content-hub/mobile-body-scanning-patient-engagement/"

  excluded_topics:   # brief §7 — do not create full sections for these
    do_not_answer_in_full:
      - "How do you track fat versus muscle progress?"
      - "How do you visually display fat versus muscle change?"
      - "How do you show meaningful progress at 5-, 10-, or 20-pound milestones?"
    reason: "These belong to the progress-tracking content cluster, not this article."
    if_touched_elsewhere_rewrite_as:
      - "How can programs compare changes in estimated fat mass and lean mass over time?"
      - "How can platforms present changes in body-composition estimates, measurements, and 3D body shape?"
      - "Can programs compare milestone scans after a defined change in weight?"
    note: "Use lean mass, not muscle mass, unless explicitly discussing the difference."

  terminology_guardrails:   # brief §8, on top of stable hard-bans (see `terminology` pointer below)
    - "Use \"FitXpress\" consistently."
    - "Define RTPV-equivalent term at first use (see unconfirmed_product_behavior for the naming caution)."
    - "Refer to clothing detection as a capture-quality feature (lowercase descriptive — see unconfirmed_product_behavior)."
    - "Use \"guided two-photo capture\", \"two-photo body measurement technology\", or \"remote body measurement capture\" — do not lean repeatedly on generic \"AI body scanning\"."
    - "\"Front and side photos\", not undefined \"body images\"."
    - "Distinguish body measurements from body-composition estimates; describe body fat %, fat mass, lean mass as estimates."
    - "\"Calculated BMI\" only when the weight input and calculation basis are clear."
    - "\"Predicted weight\" reserved for the Smart Scales feature (tech-spec.md: Smart Scales is a (beta) feature)."
    - "Never describe lean mass as muscle mass. Never claim FitXpress calculates visceral fat."
    - "Never call any output diagnostic or clinical-grade."
    - "Never say the system guarantees accuracy, prevents all poor inputs, or eliminates retakes."
    - "Never say FitXpress makes clinical, treatment, triage, or eligibility decisions."
    - "Use the approved statement verbatim: \"FitXpress is not a medical device.\" (FXS-MEDICAL)."

  body_progress_guardrails:   # brief §9 — apply only if Body Progress is mentioned (likely Q11 bridge)
    - "Explain it compares two scans using their scan IDs; the customer selects the scans to compare."
    - "Do not imply 3DLOOK identifies or tracks individuals, or independently maintains a person-level progress history."
    - "State the customer determines whether and how progress tracking is enabled; milestone logic belongs to the customer's program."
    - "If 5-/10-/20-pound milestones are mentioned elsewhere, identify the source of the weight. Do not imply ordinary FitXpress output automatically detects weight milestones."

