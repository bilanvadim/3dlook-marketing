  unconfirmed_product_behavior:   # brief §15 checklist — qualify, do not invent
    - item: "\"Real-Time Pose Validation (RTPV)\" as a named/branded acronym"
      status: "NOT attested anywhere in product-info canon (tech-spec.md, how-it-works.md, faq.md, overview.md, competitors.md — checked directly). Canon consistently uses lowercase descriptive phrasing: 'real-time pose / tilt validation', 'AI-powered pose validation engine', 'Real-time pose detection'."
      instruction: "Do not present RTPV as an established/trademarked feature name the way 'Smart Scales' is. Use lowercase descriptive phrasing throughout; if the brief's acronym is kept for readability, flag it to Vadim as unverified naming rather than treating it as settled fact."
    - item: "\"Clothing Detector\" as a capitalized proper-noun feature name"
      status: "NOT attested — canon uses lowercase 'AI clothing detector' / 'real-time clothing detection' / 'clothing classification'."
      instruction: "Use lowercase descriptive phrasing, not a capitalized branded name."
    - item: "Whether capture is blocked / paused / repeated for a failed quality condition"
      status: "NOT confirmed as 'blocked' or 'paused' anywhere. Canon only confirms pose validation 'reduces retakes' (tech-spec.md:44) and clothing detection 'flags... and prompts user' (tech-spec.md:49)."
      instruction: "Write as prompts/corrections/another attempt, never as an automatic block, per the brief's own Q3 caution."
    - item: "Self-scan timer / voice guidance"
      status: "NOT confirmed. Only confirmed self-scan detail: phone on a flat surface, real-time on-screen positioning feedback, standard indoor lighting fine, any background."
      instruction: "Omit timer/voice claims, or explicitly flag as unconfirmed if the writer wants to keep the phrasing pending Vadim's confirmation."
    - item: "React Native SDK support"
      status: "NOT confirmed. Canon names three SDKs + API: iOS (Swift), Android (Kotlin), 'Camera SDK (React)' described as 'React (web + hybrid)'. No source says 'React Native'."
      instruction: "Use 'Camera SDK (React), for web and hybrid apps' — do not assert explicit React Native support."
    - item: "FitXpress Admin Panel naming"
      status: "CONFIRMED as approved terminology — not unconfirmed. Sourced from Vadim's 2026-09-21 checkpoint decision (FXS-DELIVERY) and the live product-announcement article 'fitxpress-admin-panel-launch', even though the literal string doesn't appear in product-info/*.md files."
      instruction: "Use directly, no softening."
    - item: "Timing figures beyond 'under 45 seconds'"
      status: "NOT confirmed. No canon source gives a separate capture-only or processing-only number, or any figure like 'under 10 seconds' or 'under 40 seconds'."
      instruction: "Use ONLY FXS-SPEED's 'under 45 seconds' for the full pipeline; do not separate into sub-timings not in canon."

