      finding: "about one in eight US adults (12%) said they are currently taking a GLP-1 drug, to lose weight or to treat a chronic condition"
      note: "ONE sentence (decisions section 6, Section 1) and it must say the figure describes US adults generally, not fitness app members. No extrapolation. JAMA Viewpoint (Conte, Hall, Klein) NOT used: unverifiable at the primary source (403)."

