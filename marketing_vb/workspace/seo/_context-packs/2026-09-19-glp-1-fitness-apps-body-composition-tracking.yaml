  # ---------------- skeleton (decisions section 6; H2 wording is the planner's, in '### Section N.' form) ----------------
  section_skeleton:
    opening: "Member on GLP-1 treatment; what the scale number does and does not show; one link to the AI in Fitness hub; scope note. No 'Short answer' H2."
    section_1: "Why this is a fitness app question. Strength program plus weight chart leaves training record disconnected from body-change data. EXT-KFF one sentence. One link to glp-1-market, one to visual-progress-tracking-glp1-adherence-retention. No retention claims."
    section_2: "What the evidence says, and what a scan cannot determine. H2 carries 'GLP-1 muscle loss'. EXT-NEELAND, lean mass vs muscle, 'appear to be adaptive', EXT-JOINT-ADVISORY (amended), T-MUSCLE-FUNCTION."
    section_3: "What to show in a GLP-1-aware fitness progress view. T-TABLE, Image 1 (illustrative), T-ESTIMATES, T-WEIGHT-SOURCE."
    section_4: "How to run comparable check-ins. Baseline (T-BASELINE), cadence (moved from FAQ), capture conditions, review of differences (change-threshold point: smallest difference worth showing depends on observed scan-to-scan variation and the interval; link to the online coaching article), alternative path (FXS-POPULATION first two sentences, plus one sentence: the app can offer manual measurements or a weight-only progress view for members who cannot use standard capture)."
    section_5: "Where FitXpress fits and what to test in a pilot. FXS-OUTPUTS, FXS-SPEED, T-BODY-PROGRESS, integration responsibilities (T-PRIVACY-ROLES, T-RECORDS-ACTORS; replaces the 4-row roles table), measurement limits (FXS-ACCURACY, FXS-REPEAT, T-REPEAT-SCOPE, T-VALIDATION), T-34K (placement rule), T-GUARDRAIL-DXA once, pilot metrics. ADD one contextual link to the fitness product page where the integration workflow is discussed; keep the final CTA too."
    faq: "Short. First: 'Can a mobile body scan measure muscle loss during GLP-1 treatment?' (current wording). Keep a question only if the body does not answer it. 'How often' goes into Section 4. 'Does a fitness app need to know whether a member takes a GLP-1 medication?' may stay, aligned with T-PRIVACY-ROLES."
    next_steps_cta: "Keep. One CTA to the fitness product page."
    removed_or_condensed:
      - "Roles section and 4-row table: condensed into Section 5"
      - "'Which fits when' scale vs scan vs DXA/BIA section: REMOVED, one sentence plus one link to remote-body-measurement-online-fitness-coaching"
      - "'Fitness apps and GLP-1 programs this workflow fits': cut (second-record-by-different-method point may survive as one sentence in Section 4 or 5; GLP-1 tools article link may survive once)"
      - "'Implementation and evaluation considerations': privacy to Section 5, thresholds and alternative path to Section 4, pilot to Section 5"
    images:
      image_1: "Annotated, explicitly 'Illustrative example' app progress view: dated weight, circumference and composition trends, method labels, training blocks. Section 3."
      image_2: "Capture-to-results visual: two photos, guided capture, results."
      rule: "Neither may show a scan measuring muscle tissue. Same rule for the cover concept."

  # ---------------- ICP ----------------
  icp_context:
    segment: "Connected & Digital Fitness (audience.md #3), with the GLP-1 program actor (audience.md #1) as the secondary reader. Write for the app team."
    buyer_persona: "Fitness side: Founder/CEO, Chief Product Officer, Head of Growth, VP User Engagement. GLP-1 side: Head of Member Engagement, Chief Medical Officer."
    pain_points:
      - "A weight chart alone leaves the training record disconnected from body-change data"
      - "Members on GLP-1 treatment see the scale fall whatever the training program adds"
      - "Small real changes get lost in measurement noise without scan-to-scan repeatability"
