    hero_message: "Make body progress visible, beyond the scale number."
    segment_hook: "Visible transformation plus body-data personalization -> engagement; tone lighter and less clinical than the GLP-1 half."
    do_not_say:
      - "No medical, diagnostic or clearance language; no eligibility decisioning; keep separate from UK online-pharmacy BMI compliance and from wellness rewards"
      - "No dosing, prescribing or medication-effectiveness claims about GLP-1 itself"
      - "Not a DXA or calibrated-scale replacement"

  competitors_context: "Prism Labs is the main FX competitor in GLP-1 and weight-loss programs. Never named in the article. Angle: repeatable scan-to-scan comparison inside the app's own interface via API/SDK."

