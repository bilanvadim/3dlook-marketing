# Rebuilt by context-pack-builder 2026-10-20 for Review 1 re-plan (read-only agent); saved to disk by the coordinator.
# Stable sections are copied VERBATIM from _stable-fitxpress.yaml (rendered 2026-10-20). Delta = this topic only.
# Authority order for the delta: review-1-decisions.md > this pack > review-1.md > old pack (2026-09-19).
context_pack:
  created: 2026-10-20
  product: fitxpress
  track: seo
  channel: blog
  profile: none
  target_agent: seo-planner   # then seo-writer / seo-editor read the same pack
  slug: "2026-09-19-glp-1-fitness-apps-body-composition-tracking"
  published_slug: "glp-1-muscle-loss-fitness-apps"   # unchanged, page not live (404 on 2026-10-20)
  round: "Review 1 re-plan (STRUCTURAL): plan -> write -> edit -> publish -> qc -> git"

  objective: >
    Re-plan after Review 1 (structural) of the fitness-app article on GLP-1 muscle loss. The app
    team's decisions are the organizing thread: what the app receives, shows, compares, and routes
    for review. New section skeleton per review-1-decisions.md section 6 (Opening, Sections 1-5,
    short FAQ, Next steps/CTA); the 12-section outline is replaced. Primary keyword "glp-1 muscle loss"
    unchanged; slug glp-1-muscle-loss-fitness-apps unchanged. H1 rule (decisions section 1): contains the
    exact string "GLP-1 muscle loss" (any case), framed as the question or concern the app team faces,
    never as something the app or scan measures; keep "Tracking Body Change Beyond Scale Weight" or close
    to it as the second half; planner proposes 2-3 candidates in plan-audit.md, picks one, gives the reason.
    Target 1,400-1,800 words of article prose. Hub 1 (AI in Fitness), bridge into Hub 3 (GLP-1 Market),
    create net-new, P1. One CTA to the fitness product page. Author Assel Sekerova.
  scope_rule: >
    FitXpress does not detect, reveal or measure muscle loss, and no sentence may imply it. Lean mass is
    an estimate. Lean mass includes more than muscle. The scan does not determine which tissue changed.
    No sentence says the scan shows or exposes lean mass loss behind the scale.

  phase_0_resolved: true   # row located and verified earlier; do not re-litigate
  action_type: "Create net-new"   # verbatim from the sheet row; GATE family: GO

  company_oneliner: "3DLOOK turns two smartphone photos into a 3D body model and 80+ body measurements in 45 seconds, via API and SDK."

  product_summary: |
    FitXpress: mobile body scanning that returns 80+ body measurements, a 3D model and body composition
    estimates from two smartphone photos, delivered via API/SDK into the fitness app's own interface.
    For this topic it is a structured capture and scan-to-scan comparison layer that a fitness app can
    show next to weight, circumferences and training history. It is not a scale, not a medical device,
    not a prescribing or dosing tool, and it does not determine which tissue changed.

  # ---------------- approved_claims ----------------
  approved_claims:
    # --- stable FXS-* (verbatim from _stable-fitxpress.yaml) ---
    - id: FXS-SPEED
      text: "Two photos (front + side); structured outputs in under 45 seconds."
      source: "proof-points.md, Speed table"
    - id: FXS-OUTPUTS
      text: "80+ body measurements; body composition outputs: BMI, BMR, fat %, lean mass, fat mass, essential fat, beneficial fat."
      source: "proof-points.md, Output coverage (формулировка строки 'Body composition outputs' дословно)"
      note: "Всегда «80+ body measurements», никогда «80+ body metrics»; BMI/BMR/composition — calculated metrics/estimates, не measurements (terminology §2.13)."
    - id: FXS-DELIVERY
      text: "Delivered primarily via API/SDK integration directly into the customer's own product or interface; the FitXpress Admin Panel is an optional, complementary interface for monitoring and exporting results, for teams that do not want to build their own dashboard; it does not replace integration."
      source: "overview.md (API and SDK) + решение Вадима на чекпоинте 1 Telehealth Documentation, 2026-09-21"
      note: "«monitoring and exporting» — канон с 2026-09-23 (Вадим, Review 1 capture-quality FAQ, C11). Порядок ФИКСИРОВАН Вадимом 2026-09-21: API/SDK — главная история доставки, Admin Panel называется прямо («FitXpress Admin Panel», не «vendor console») и идёт вторым, как опция."
    - id: FXS-ACCURACY
      text: "3DLOOK's measurement accuracy of approximately 96-97% across body metrics, with a typical absolute error of 1.5-2.0 cm per measurement, varying by body part"
      source: "accuracy-formulations.md §1.1, verbatim из живой framework-статьи"
      note: "SECONDARY: только если статья реально обсуждает точность. Никогда без условия (референс/популяция/протокол) и без ссылки на framework-статью из того же абзаца. Два бенчмарка (этот и ISO 8559 0.40 cm) не совмещаются в одном абзаце."
    - id: FXS-REPEAT
      text: "For most evaluated measurements, repeated scans showed typical scan-to-scan differences of less than 1 cm"
      source: "accuracy-formulations.md §1.2"
      note: "SECONDARY: для longitudinal/repeat-scan тем. Пишется «< 1 cm» / «below 1 cm», locked convention."
    - id: FXS-POPULATION
      text: "FitXpress was not specifically trained on data representing people with physical disabilities, and its measurement performance has not been established for this population. This matters when a disability affects the standard standing pose or capture sequence. In those cases, the program needs a documented alternative measurement path."
      source: "accuracy-formulations.md §5 «Population limitation»; апрув Вадима 2026-09-11"
      note: "Третье предложение — для workflow-статей (§5 сам так говорит); в остальных берутся первые два. Цифр не несёт."
    - id: FXS-HIPAA
      text: "FitXpress can support HIPAA-governed deployments where 3DLOOK acts as a business associate under an executed BAA, where applicable."
      source: "compliance.md §1, живой trust FAQ"
      note: "Section-first: короткая заметка + ссылка на FAQ, ответы FAQ не пересказывать. «HIPAA compliant/certified» — hard fail детектора."
    - id: FXS-GDPR
      text: "In most enterprise deployments, the customer acts as the data controller and 3DLOOK acts as the data processor under GDPR."
      source: "compliance.md §2 — каноническое предложение, дословно"
      note: "Не выбрасывать «the data»; хедж «In most enterprise deployments» не срезается."
    - id: FXS-IDS
      text: "Scan records are associated with anonymized, randomly generated IDs; 3DLOOK cannot identify a specific individual from stored scan records."
      source: "compliance.md §4"
    - id: FXS-LIFECYCLE
      text: "Submitted data: front/side photos + gender + height + optional weight. Generated data: body measurements, weight/BMI-related outputs, body composition estimates, a 3D model, scan-to-scan comparison outputs. Technical data: capture-quality/pose-validation flags, clothing classification, face-obfuscation confirmation, processing logs with timestamps and request metadata."
      source: "compliance.md §3"
    - id: FXS-RETENTION
      text: "Measurements, body composition data and 3D models are retained on an ongoing basis unless the customer agreement says otherwise; deletion is by scan identifier on the customer's request."
      source: "compliance.md §3/§4"
      note: "«Processed, not stored» — запрещено: выводы ХРАНЯТСЯ."
    - id: FXS-SCOPE
      text: "Supports: remote intake and body-measurement capture; body composition outputs and Body Progress comparisons; structured data collection for research protocols; structured intake and supporting documentation for customer-managed eligibility workflows; patient/member engagement. Does not independently determine: a diagnosis, treatment, medication recommendation, fitness for duty, employment eligibility, insurance eligibility, clinical-trial eligibility, or any other high-impact individual decision. Final decisions stay with the customer's clinicians, underwriters or other designated decision-makers."
      source: "compliance.md §7"
      note: "Канонический boundary-блок («What FitXpress does not do», пункт 7 стандартной структуры about-me.md)."
    - id: FXS-MEDICAL
      text: "FitXpress is not a medical device."
      source: "compliance.md; решение Вадима 2026-09-11 (4-е состояние правила)"
      note: "Формулируется прямо; «positioned as» про любой product/intended-use/регуляторный факт — hard fail."

    # --- topic claims LOCKED by review-1-decisions.md: place VERBATIM, do not paraphrase or improve ---
    - id: T-ESTIMATES
      text: "Body composition estimates are derived from the body measurements along with height and optional weight. Body fat percentage comes from an anthropometric formula applied to those measurements. These are model-derived estimates to review alongside weight and measurements. They do not determine which tissue changed."
      source: "decisions section 2; grounding compliance.md §3 (composition values are estimates derived from measurements plus height and optional weight), terminology §2.13, how-it-works.md step 5"
      note: "Three sentences, this order, where the article first explains the estimates. Do not name the US Navy formula. Remove every 'split(s) into fat and lean' wording."
    - id: T-REPEAT-SCOPE
      text: "These figures describe body measurements. They are not validated accuracy for lean mass, for detecting muscle loss, or for the smallest meaningful change during GLP-1 treatment."
      source: "decisions section 4"
      note: "Directly after the accuracy and repeatability sentences (FXS-ACCURACY, FXS-REPEAT, hyphens in 96-97% and 1.5-2.0 cm). The repeatability sentence REPLACES the old 'For most of the evaluated measurements, typical scan-to-scan differences remained below 1 cm.' Accuracy-framework link once in this paragraph. Never place 0.40 cm (ISO) in this article. NDA sentence may stay: 'Detailed methodology, including sample size, measurement-level results, and the definition of repeatability used in the analysis, is available under NDA.' (accuracy-formulations §1.8)."
    - id: T-VALIDATION
      text: "3DLOOK's accuracy claims have not been peer-reviewed or externally validated through a third-party clinical study."
      source: "accuracy-formulations.md §1.9; decisions section 4"
      note: "Same paragraph as T-REPEAT-SCOPE. Do not use 'independent', 'third-party', 'validated', 'peer-reviewed' about our own evidence outside this sentence. NCSU line (dataset enrichment, not independent validation) is available if scope comes up."
    - id: T-BASELINE
      text: "A later scan can establish a new baseline, but it cannot recreate the earlier measurement."
      source: "decisions section 6, Section 4"
      note: "Replaces 'a baseline skipped at onboarding cannot be taken afterwards'. Keep the point that a member may already be partway through treatment when the app's record begins."
    - id: T-MUSCLE-FUNCTION
      text: "A clinician's assessment of muscle function is a separate question from a composition reading."
      source: "decisions G1"
      note: "Section 2 or 5. Never call DXA and professional BIA 'reference methods' (headings included); a protocol names its own method; do not present them as equivalent references."
    - id: T-WEIGHT-SOURCE
      text: "Weight in the progress view is the value the member enters or the app syncs from a connected scale."
      source: "decisions G2; how-it-works.md (Smart Scales is a beta output)"
      note: "Section 3. Do not imply FitXpress capture supplies a measured scale weight."
    - id: T-BODY-PROGRESS
      text: "The app company links each scan ID to its own member record and chooses which two scans to compare. 3DLOOK does not track individuals or determine whether two scans belong to the same person."
      source: "decisions G3; compliance.md §4, CLAUDE.md §12"
      note: "Section 5. Never write that FitXpress tracks a member over time (use 'scan-to-scan comparison'). A visible difference between two 3D models is not by itself a clinically meaningful change."
    - id: T-PRIVACY-ROLES
      text: "Sharing records between the fitness app company and the prescribing provider depends on the applicable lawful basis, privacy notices, member permissions, and the agreements between them. Consent is required in some workflows."
      source: "decisions G4; compliance.md §6 (the customer provides privacy notices, establishes the lawful basis, obtains consent where needed)"
      note: "Link to the privacy FAQ once, mid-paragraph. REPLACES 'record sharing depends on the member's consent and on agreements between the two'. FAQ answer on asking about medication keeps 'purpose, notice' and replaces bare 'consent' with 'lawful basis, notice, and consent where required'."
    - id: T-RECORDS-ACTORS
      text: "the fitness app company and the prescribing provider may each hold different records."
      source: "decisions G5; terminology-guardrails §2.14"
      note: "REPLACES 'two organizations hold parts of the progress record'. No 'organization(s)' anywhere the actor is known. 'Company' for a FitXpress buyer."
    - id: T-34K
      text: "A weight-loss management platform ran 34,000 FitXpress scans in 2025. It used them for periodic check-in progress tracking, 3D visualization, and body composition context."
      source: "proof-points.md Customer outcomes (2025 scans 34,000, internal customer breakdown); case-studies/yazen.md 'What they use'; decision section 5"
      note: "PLACEMENT RULE: no link on this sentence and not in the same paragraph as the product-page link. No geography, no customer name. Vadim 2026-09-19: DO NOT NAME YAZEN anywhere (article, meta, alt text, FAQ, publish package). Open item for Vadim in digest: customer sign-off on the use description (the two sentences cut cleanly if wanted)."
    - id: T-GUARDRAIL-DXA
      text: "FitXpress is not equivalent to DXA, BIA, or a calibrated scale when the workflow, protocol, or regulatory standard requires those methods."
      source: "accuracy-formulations §1.9 (equivalence rule); current v2 final.md sentence, kept"
      note: "Verbatim, once. Lead-in sentence (separate): 'Some clinical protocols and research studies require dual-energy X-ray absorptiometry (DXA) or professional bioelectrical impedance analysis (BIA).'"

    - id: T-TABLE
      text: "Header: What the app receives | What it can show or do | What it should avoid concluding"
      rows:
        - ["Scale weight and scan estimates", "Display dated trends with the measurement method labeled", "Attribute a change to fat or muscle with certainty"]
        - ["Circumferences and training history", "Allow a member or coach to review both at a scheduled check-in", "Claim the training program caused a measured change"]
        - ["A concerning or inconsistent result", "Check capture conditions and offer a route to the care team", "Generate medication or clinical advice"]
      source: "review-1.md, accepted verbatim by decisions section 3"
      note: "Place in Section 3 with Image 1. One or two sentences before the table say why it matters to an app team. No sentence after the table restates it."

  # ---------------- external sources (verified wording; attribute in words, never in our own voice) ----------------
  external_sources:
