  # ── STABLE (verbatim from _stable-fitxpress.yaml, rendered 2026-09-23) ──
  company_oneliner: "3DLOOK turns two smartphone photos into a 3D body model and 80+ body measurements in 45 seconds, via API and SDK."

  approved_claims:
    - id: FXS-SPEED
      text: "Two photos (front + side); structured outputs in under 45 seconds."
      source: "proof-points.md, Speed table"
    - id: FXS-OUTPUTS
      text: "80+ body measurements; body composition outputs: BMI, BMR, fat %, lean mass, fat mass, essential fat, beneficial fat."
      source: "proof-points.md, Output coverage (verbatim)"
      note: "Always '80+ body measurements', never '80+ body metrics'; BMI/BMR/composition = calculated metrics/estimates, not measurements (terminology §2.13)."
    - id: FXS-DELIVERY
      text: "Delivered primarily via API/SDK integration directly into the customer's own product or interface; the FitXpress Admin Panel is an optional, complementary interface for monitoring and exporting results, for teams that do not want to build their own dashboard; it does not replace integration."
      source: "overview.md + Vadim, checkpoint 1 Telehealth Documentation, 2026-09-21"
      note: "Order is FIXED: API/SDK first, Admin Panel named directly and second, as an option."
    - id: FXS-ACCURACY
      text: "3DLOOK's measurement accuracy of approximately 96-97% across body metrics, with a typical absolute error of 1.5-2.0 cm per measurement, varying by body part"
      source: "accuracy-formulations.md §1.1, verbatim"
      note: "SECONDARY: only if the article actually discusses accuracy. Never without a condition (reference/population/protocol) and without linking the framework article in the same paragraph. Never combine with the ISO 8559 0.40 cm benchmark in one paragraph."
    - id: FXS-REPEAT
      text: "For most evaluated measurements, repeated scans showed typical scan-to-scan differences of less than 1 cm"
      source: "accuracy-formulations.md §1.2"
      note: "For longitudinal/repeat-scan topics — directly relevant here (progress tracking, GLP-1 section). Write '< 1 cm' / 'below 1 cm', locked convention."
    - id: FXS-POPULATION
      text: "FitXpress was not specifically trained on data representing people with physical disabilities, and its measurement performance has not been established for this population. This matters when a disability affects the standard standing pose or capture sequence. In those cases, the program needs a documented alternative measurement path."
      source: "accuracy-formulations.md §5; Vadim 2026-09-11"
      note: "Third sentence for workflow articles (this one qualifies)."
    - id: FXS-HIPAA
      text: "FitXpress can support HIPAA-governed deployments where 3DLOOK acts as a business associate under an executed BAA, where applicable."
      source: "compliance.md §1, live trust FAQ"
      note: "Section-first: short note + link to FAQ. 'HIPAA compliant/certified' = hard fail."
    - id: FXS-GDPR
      text: "In most enterprise deployments, the customer acts as the data controller and 3DLOOK acts as the data processor under GDPR."
      source: "compliance.md §2, verbatim"
      note: "Do not drop 'the data'; hedge 'In most enterprise deployments' not cut."
    - id: FXS-IDS
      text: "Scan records are associated with anonymized, randomly generated IDs; 3DLOOK cannot identify a specific individual from stored scan records."
      source: "compliance.md §4"
    - id: FXS-LIFECYCLE
      text: "Submitted data: front/side photos + gender + height + optional weight. Generated data: body measurements, weight/BMI-related outputs, body composition estimates, a 3D model, scan-to-scan comparison outputs. Technical data: capture-quality/pose-validation flags, clothing classification, face-obfuscation confirmation, processing logs with timestamps and request metadata."
      source: "compliance.md §3"
    - id: FXS-RETENTION
      text: "Measurements, body composition data and 3D models are retained on an ongoing basis unless the customer agreement says otherwise; deletion is by scan identifier on the customer's request."
      source: "compliance.md §3/§4"
      note: "'Processed, not stored' is banned — outputs ARE stored. Directly relevant: live page's 'automatic photo deletion after model generation' is factually wrong per this claim (see refresh.defects_to_remove)."
    - id: FXS-SCOPE
      text: "Supports: remote intake and body-measurement capture; body composition outputs and Body Progress comparisons; structured data collection for research protocols; structured intake and supporting documentation for customer-managed eligibility workflows; patient/member engagement. Does not independently determine: a diagnosis, treatment, medication recommendation, fitness for duty, employment eligibility, insurance eligibility, clinical-trial eligibility, or any other high-impact individual decision. Final decisions stay with the customer's clinicians, underwriters or other designated decision-makers."
      source: "compliance.md §7"
    - id: FXS-MEDICAL
      text: "FitXpress is not a medical device."
      source: "compliance.md; Vadim 2026-09-11"
      note: "Direct statement; 'positioned as' about any product/intended-use/regulatory fact is a hard fail. Kills live page's 'medical-grade measurements/precision' and 'Dose medications accurately.'"

  banned_claims:
    - "most accurate body scanning / best-in-class (no specific benchmark)"
    - "any accuracy number collapsed to one universal figure without decision/reference/protocol/population/tolerance"
    - "medical device / diagnostic / clinical assessment / dosing / prescribing recommendation / eligibility decisioning"
    - "replaces DXA (also written DEXA), BIA, calibrated scales, or clinician review"
    - "automated eligibility, underwriting, or fraud-detection claims"
    - "guaranteed compliance / 'makes you compliant' / guaranteed outcomes"
    - "any number not in approved_claims"
    - "named competitor comparisons"
    - "HIPAA compliant / HIPAA certified / SOC 2 certified / FDA-cleared"
    - "'no personal identifiers' / 'no personal data' — retired 2026-09-18"
    - "'processed, not stored' — outputs are stored on an ongoing basis"
    - "'FitXpress tracks each patient over time' → 'the program compares scans it selects' / 'scan-to-scan comparison'"
    - "'95%+ repeatability consistency' — internal, NOT publishable"
    - "'objective' about our tech/output — use standardized · timestamped · structured · repeatable"

  banned_words: [comprehensive, delve, disrupt, groundbreaking, harness, leverage, realm, revolutionary, robust, seamless, tapestry, unparalleled]

  terminology: "Writer reads brand-assets/style-guides/hard-bans-card.md (generated, single screen) for mechanical bans. Judgment calls (corrective negation, we/our, you, buyer/customer, content-plan labels in headings) stay with the editor per terminology-guardrails.md."

  tone_base:
    - "calm, specific, evidence-led B2B; the reframe move as a statement, not a rhetorical question"
    - "sentences average < 16 words (article_lint gate 10); declarative, concrete over abstract"
    - "honesty about limits in the same breath as capability; actor framing (telehealth program, care team, clinic operator), not 'you'-spam"
    - "sensitive verticals (telehealth, GLP-1 both apply here): early italic scope note"

  claims_discipline:
    - "NEVER: diagnose, make treatment/eligibility/clearance decisions, replace clinician/DXA/BIA/calibrated scale, guarantee compliance, auto-detect fraud."
    - "Describe as: a mobile body-scanning solution; a structured body-data capture layer; a remote intake and documentation layer; a workflow-standardization tool. FitXpress is not a medical device."

