  created: 2026-11-18
  product: fitxpress
  track: seo
  objective: "refresh-in-place: ai-body-scanning-for-fitness (Hub 1 AI in Fitness, MOFU commercial use case, bridge to the fitness landing)"
  target_agent: seo-planner (then seo-writer/seo-editor)
  workspace: ai-body-scanning-for-fitness-refresh

  # STABLE (verbatim from _stable-fitxpress.yaml, rendered 2026-11-04)
  company_oneliner: "3DLOOK turns two smartphone photos into a 3D body model and 80+ body measurements in 45 seconds, via API and SDK."

  approved_claims:
    - id: FXS-SPEED
      text: "Two photos (front + side); structured outputs in under 45 seconds."
      source: "proof-points.md, Speed table"
    - id: FXS-OUTPUTS
      text: "80+ body measurements; body composition outputs: BMI, BMR, fat %, lean mass, fat mass, essential fat, beneficial fat."
      source: "proof-points.md, Output coverage (формулировка строки 'Body composition outputs' дословно)"
      note: "Всегда «80+ body measurements», никогда «80+ body metrics»; BMI/BMR/composition — calculated metrics/estimates, не measurements (terminology §2.13)."
    - id: FXS-DELIVERY
      text: "Delivered primarily via API/SDK integration directly into the customer's own product or interface; the FitXpress Admin Panel is an optional, complementary interface for monitoring and exporting results, for teams that do not want to build their own dashboard; it does not replace integration."
      source: "overview.md (API and SDK) + решение Вадима на чекпоинте 1 Telehealth Documentation, 2026-09-21"
      note: "«monitoring and exporting» — канон с 2026-09-23 (Вадим, Review 1 capture-quality FAQ, C11). Порядок ФИКСИРОВАН Вадимом 2026-09-21: API/SDK — главная история доставки, Admin Panel называется прямо («FitXpress Admin Panel», не «vendor console») и идёт вторым, как опция."
    - id: FXS-ACCURACY
      text: "3DLOOK's measurement accuracy of approximately 96-97% across body metrics, with a typical absolute error of 1.5-2.0 cm per measurement, varying by body part"
      source: "accuracy-formulations.md §1.1, verbatim из живой framework-статьи"
      note: "SECONDARY: только если статья реально обсуждает точность. Никогда без условия (референс/популяция/протокол) и без ссылки на framework-статью из того же абзаца. Два бенчмарка (этот и ISO 8559 0.40 cm) не совмещаются в одном абзаце."
    - id: FXS-REPEAT
      text: "For most evaluated measurements, repeated scans showed typical scan-to-scan differences of less than 1 cm"
      source: "accuracy-formulations.md §1.2"
      note: "SECONDARY: для longitudinal/repeat-scan тем. Пишется «< 1 cm» / «below 1 cm», locked convention."
    - id: FXS-POPULATION
      text: "FitXpress was not specifically trained on data representing people with physical disabilities, and its measurement performance has not been established for this population. This matters when a disability affects the standard standing pose or capture sequence. In those cases, the program needs a documented alternative measurement path."
      source: "accuracy-formulations.md §5 «Population limitation»; апрув Вадима 2026-09-11"
      note: "Третье предложение — для workflow-статей (§5 сам так говорит); в остальных берутся первые два. Цифр не несёт."
    - id: FXS-HIPAA
      text: "FitXpress can support HIPAA-governed deployments where 3DLOOK acts as a business associate under an executed BAA, where applicable."
      source: "compliance.md §1, живой trust FAQ"
      note: "Section-first: короткая заметка + ссылка на FAQ, ответы FAQ не пересказывать. «HIPAA compliant/certified» — hard fail детектора."
    - id: FXS-GDPR
      text: "In most enterprise deployments, the customer acts as the data controller and 3DLOOK acts as the data processor under GDPR."
      source: "compliance.md §2 — каноническое предложение, дословно"
      note: "Не выбрасывать «the data»; хедж «In most enterprise deployments» не срезается."
    - id: FXS-IDS
      text: "Scan records are associated with anonymized, randomly generated IDs; 3DLOOK cannot identify a specific individual from stored scan records."
      source: "compliance.md §4"
    - id: FXS-LIFECYCLE
      text: "Submitted data: front/side photos + gender + height + optional weight. Generated data: body measurements, weight/BMI-related outputs, body composition estimates, a 3D model, scan-to-scan comparison outputs. Technical data: capture-quality/pose-validation flags, clothing classification, face-obfuscation confirmation, processing logs with timestamps and request metadata."
      source: "compliance.md §3"
    - id: FXS-RETENTION
      text: "Measurements, body composition data and 3D models are retained on an ongoing basis unless the customer agreement says otherwise; deletion is by scan identifier on the customer's request."
      source: "compliance.md §3/§4"
      note: "«Processed, not stored» — запрещено: выводы ХРАНЯТСЯ."
    - id: FXS-SCOPE
      text: "Supports: remote intake and body-measurement capture; body composition outputs and Body Progress comparisons; structured data collection for research protocols; structured intake and supporting documentation for customer-managed eligibility workflows; patient/member engagement. Does not independently determine: a diagnosis, treatment, medication recommendation, fitness for duty, employment eligibility, insurance eligibility, clinical-trial eligibility, or any other high-impact individual decision. Final decisions stay with the customer's clinicians, underwriters or other designated decision-makers."
      source: "compliance.md §7"
      note: "Канонический boundary-блок. Fitness: брать только первое утверждение о поддержке (capture, Body Progress comparisons, member engagement) и короткую границу; клинические пункты не разворачивать, тон fitness светлый и не клинический (audience.md §3)."
    - id: FXS-MEDICAL
      text: "FitXpress is not a medical device."
      source: "compliance.md; решение Вадима 2026-09-11 (4-е состояние правила)"
      note: "Формулируется прямо; «positioned as» про любой product/intended-use/регуляторный факт — hard fail."
    # topic-specific (moved from additional_approved_claims_topic_specific, 2026-11-18)
    - id: FIT-ADJUST
      text: "Health and fitness apps: 24% of users are active on day 1 and 7% on day 30 (global figures, 2022 data)."
      source: "workspace/pages/for-connected-and-digital-fitness/fact-sheet.md, row 'Adjust'; primary: Adjust, Mobile app retention benchmarks for 2023, https://www.adjust.com/blog/get-the-mobile-app-retention-benchmarks-for-2023/ (verified on the primary page 2026-10-02)"
      note: "Read as app users, not paying members. Name the source and the year in the sentence. Landing wording: '24% → 7% of health and fitness app users are active on day 1; 7% are still active on day 30.' Do not quote the landing's sentence as the article's own; vary the framing, keep the figures."
    - id: FIT-KIDMAN
      text: "A median of 70% of users discontinued use of lifestyle behavior and mental health apps within the first 100 days; lack of personalization is among the reasons."
      source: "fact-sheet.md, row 'A median of 70%'; primary: Kidman PG, Curtis RG, Watson A, Maher CA. When and Why Adults Abandon Lifestyle Behavior and Mental Health Mobile Apps: Scoping Review. J Med Internet Res 2024;26:e56897, https://www.jmir.org/2024/1/e56897 (abstract: 'a median of 70% of users discontinued use within the first 100 days'; full text lists 'Lack of personalization' under Content and features; verified via Europe PMC 2026-10-02)"
      note: "Say 'median', lifestyle and mental health apps, scoping review. Not 'fitness apps lose 70%'. Not a claim that a scan fixes it."
    - id: FIT-SDK
      text: "Web and mobile SDKs, including supported iOS and Android integrations. Recommended setup: the SDK together with the API, because pose and framing validation runs in the SDK's capture layer."
      source: "tech-spec.md (public SDK wording, Vadim 2026-09-23; 'integrate the SDK, not just API'), via fact-sheet.md"
      note: "Order stays API/SDK first (FXS-DELIVERY). No 'any Android device'; no iOS/Android SDK feature beyond tech-spec wording."
    - id: FIT-RTPV
      text: "Real-Time Pose Validation pauses capture until pose and framing requirements are met; voice prompts guide a member scanning alone."
      source: "tech-spec.md RTPV; roadmap.md ('Real-Time Pose Validation (RTPV)' Live, approved wording in tech-spec.md); live landing 2026-11-13 ('pose and framing guidance during capture, with voice prompts')"
      note: "Say 'helps avoid retakes', never an internal retake figure. Do not name 'RTPV 2.0'. Clothing Detector in the API is planned (roadmap.md): do not describe payload flags or 'prompts the user'."
    - id: FIT-WHITELABEL
      text: "The platform designs the onboarding, consent and results screens, so the member sees the scan under the app's own brand and the platform chooses what the member and the coach see. The photo-capture layer, where pose validation runs, stays fixed to protect measurement quality."
      source: "tech-spec.md 'What's customizable (white-label)' / 'What's NOT customizable'; fact-sheet.md"
    - id: FIT-CAPTURE
      text: "The scan runs on the member's own phone, with no hardware and no club visit. For repeat scans, keep conditions consistent: form-fitting clothing, the same place, the phone on a stable surface."
      source: "tech-spec.md ('Works on any smartphone camera', Recommended capture environment); fact-sheet.md"
      note: "Repeatability depends on consistent capture (accuracy-formulations.md §1.2 context)."
    - id: FIT-PLAN
      text: "3D Body Progress tracking and 3D Goal Visualization are features of the FitXpress Pro plan."
      source: "live /pricing/ read 2026-10-02 and 2026-10-06 via fact-sheet.md; landing 2026-11-13"
      note: "Name the 3D features only with 'on the FitXpress Pro plan'. The live /pricing/ lists no 3D model on Starter. No plan prices or request counts in the article (landing owns them; pricing.md: public copy keeps sales-path figures out). 'No integration fee' is allowed (pricing.md, Vadim 2026-09-30) if needed."
    - id: FIT-OUTPUTS-NOTE
      text: "The accuracy figures describe body measurements. Body composition estimates are derived from the measurements with height and, where provided, weight."
      source: "compliance.md §3; fact-sheet.md; terminology §2.13"
      note: "Needed wherever FXS-ACCURACY appears with body composition nearby. BMI is a calculated metric from height and weight, not a measure of body fat (fixes a live-page defect)."
    - id: FIT-EVIDENCE-LIMIT
      text: "These figures come from internal validation of body measurements; detailed methodology is available under a non-disclosure agreement. 3DLOOK's accuracy claims have not been peer-reviewed or externally validated through a third-party clinical study."
      source: "accuracy-formulations.md §1.8 and §1.9 (verbatim); live landing uses a variant"
      note: "Quote only these two sentences from §1.9. Do not use 'independent', 'third-party', 'validated', 'peer-reviewed' as claims about our own evidence. Do not use the 'positioned as equivalent' sentences from §1.9; for equivalence use 'FitXpress is not equivalent to DXA, BIA, or a calibrated scale when the workflow, protocol, or regulatory standard requires those methods.' (§2.1 option 2)."
    - id: FIT-BODY-PROGRESS
      text: "Body Progress compares two scans chosen by the platform; 3DLOOK does not track individuals."
      source: "compliance.md §4, via fact-sheet.md"
      note: "Never 'FitXpress tracks each member over time'. Write 'the platform compares scans it selects' or 'scan-to-scan comparison'."
    - id: FIT-ACSM
      text: "ACSM's 2027 Worldwide Fitness Trends (ACSM's Health & Fitness Journal, Nov/Dec 2026; released 2026-10-20): wearable technology ranked No. 1, mobile exercise apps rose from No. 4 to No. 2, data-driven training technology held at No. 8; more than 1,400 fitness professionals responded."
      source: "ACSM release via Newswise, 2026-10-20, https://www.newswise.com/articles/acsm-announces-top-fitness-trends-for-2027 (verified by the coordinator 2026-11-18: 'Mobile exercise apps climbed from No. 4 to No. 2, while data-driven training technology held steady at No. 8'; 'more than 1,400 fitness professionals'); primary https://www.acsm.org/2027-fitness-trends/ (403 from the VPS); DOI 10.1249/fit.0000000000001208"
      note: "Forecast survey of fitness professionals rating how widely they observe trends, not usage data. The release says the ranking does not establish that a product or program is effective. Says nothing about body scanning."

  banned_claims:
    - "most accurate body scanning / best-in-class (без конкретного бенчмарка)"
    - "любая цифра точности, сведённая к одному универсальному числу без условия decision/reference/protocol/population/tolerance"
    - "medical device / diagnostic / clinical assessment / dosing / prescribing recommendation / eligibility decisioning"
    - "replaces DXA (also written DEXA), BIA, calibrated scales, or clinician review"
    - "automated eligibility, underwriting, or fraud-detection claims"
    - "guaranteed compliance / «makes you compliant» / guaranteed outcomes"
    - "любое число не из approved_claims"
    - "named competitor comparisons (Prism Labs, Bodygram, Size Stream и др.)"
    - "HIPAA compliant / HIPAA certified / SOC 2 certified / FDA-cleared"
    - "«no personal identifiers» / «no personal data» — retired 2026-09-18: фото и измерения могут быть персональными данными"
    - "«processed, not stored» — выводы хранятся on an ongoing basis"
    - "«FitXpress tracks each patient over time» → «the program compares scans it selects» / «scan-to-scan comparison»"
    - "«95%+ repeatability consistency» — внутренняя цифра, НЕ публикуется"

  banned_words: [comprehensive, delve, disrupt, groundbreaking, harness, leverage, realm, revolutionary, robust, seamless, tapestry, unparalleled]

  terminology: "Механические запреты НЕ дублируются здесь (урок bans-card.py: 4 копии правил, исполняет одна). Писатель читает brand-assets/style-guides/hard-bans-card.md (generated, один экран, не может разойтись с детектором). Судейские строки — corrective negation, we/our, you, buyer/customer, ярлыки контент-плана в заголовках — остаются в terminology-guardrails.md за редактором."

