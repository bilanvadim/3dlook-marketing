  # TOPIC DELTA

  tone_adjustments_topic:
    - "Fitness register is lighter and less clinical (audience.md §3); no scope-note italics needed beyond one plain line 'FitXpress is not a medical device.' near the record/outputs section."
    - "Reader = product, growth and founder roles at connected and digital fitness companies (icp-detail.md §8: Founder/CEO, CPO, Head of Growth, VP Engagement/Retention, CTO, Product Manager). Actor framing: fitness app, product team, coach, platform. Not 'you'-spam, not 'customer' unless a contract is meant."
    - "Segment hook (audience.md §3): visible transformation plus body-data personalization leading to engagement, retention and premium-tier monetization."
    - "Segment pains (icp-detail.md §8 / audience.md §3): churn without visible progress; high churn after onboarding; generic recommendations with limited personalization; hard to differentiate; rising CAC needs stronger engagement."
    - "do_not_say: medical, diagnostic or clearance language; do not blur into GLP-1 clinical or wellness-rewards workflows; no 'AI-powered' as a standalone value; no competitor or client names; no hype words from the live page (revolutionary, game-changer, unprecedented, harnesses, seamless, leverage, comprehensive, Moreover, 'Plus,' as a connector)."

