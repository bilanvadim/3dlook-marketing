  company_oneliner: "3DLOOK turns two smartphone photos into 80+ body measurements and a 3D model in under 45 seconds."

  product_summary: |
    FitXpress: mobile body scanning that produces structured, repeatable body data
    (80+ measurements, BMI, BMR, body fat %, lean/fat mass, 3D model) from two
    smartphone photos, delivered primarily via API/SDK integration directly into
    the customer's own product or interface; the FitXpress Admin Panel is an
    OPTIONAL centralized view for teams that do not want to build their own
    dashboard (Vadim, checkpoint 1, 2026-09-21).
    For THIS article: the angle is documentation consistency — how structured,
    timestamped, exportable records (vs. fragmented self-report + scale + photos)
    standardize what enters a telehealth program's record at the intake/capture
    step, before clinician review. Not a medical device, not a diagnostic tool,
    not an eligibility or clearance decisioning system, not a replacement for
    clinician review or DXA/BIA/calibrated-scale reference methods.

  approved_claims:
    - id: FX-001
      text: "Depending on the implementation, results can be delivered through the API to the customer's existing interface or accessed through the FitXpress Admin Panel."
      source: "workspace/seo/telehealth-hub-refresh/publish-package.md (draft language for the-potential-of-ai-in-telehealth hub, ~line 312/397) + workspace/playbooks/fitxpress-marketing-playbook-nika.md row 945: 'Admin Panel — Centralized view and management of scan results, for teams that do not want to build a dashboard.'"
      note: "THE anchor claim of this article (content-plan.md row: 'Anchored by the Admin Panel (records/export/workflow)'). CAUTION: no published-live-*.md capture exists for the-potential-of-ai-in-telehealth, so this exact sentence is a draft/deck paraphrase, not a verified live quote — treat the feature's existence and function as solid (confirmed independently by the live announcement post fitxpress-admin-panel-launch, published-articles-inventory.md:224), the exact wording as needing a light rewrite, not verbatim copy. RESOLVED at checkpoint 1 (Vadim, 2026-09-21): name it 'FitXpress Admin Panel' directly, no 'vendor console' softening. Emphasis: API/SDK integration into the client's own product is the PRIMARY delivery route; the Admin Panel is OPTIONAL and comes second. Do not invent SDK/API specifics beyond approved_claims."
    - id: FX-002
      text: "Data lifecycle: submitted data is front/side photos + gender + height + optional weight; generated data is body measurements, weight/BMI-related outputs, body composition estimates, a 3D model, and scan-to-scan comparison outputs; technical data is capture-quality/pose-validation flags, clothing classification, face-obfuscation confirmation, and processing logs with timestamps and request metadata."
      source: "compliance.md §3, live trust FAQ (2026-09-16)"
      note: "Core to the 'what gets structured into a record' half of the article's thesis."
    - id: FX-003
      text: "Measurements, body composition data and 3D models are retained on an ongoing basis unless the customer agreement says otherwise; deletion is by scan identifier on the customer's request; 3DLOOK cannot identify a specific individual from stored scan records."
      source: "compliance.md §3/§4, live trust FAQ"
      note: "The persistence half of 'documentation' — records exist and can be retrieved, not 'processed but not stored' (that phrase is banned)."
    - id: FX-004
      text: "Two photos (front + side); structured outputs in under 45 seconds."
      source: "proof-points.md, Speed table"
    - id: FX-005
      text: "80+ body measurements; body composition outputs: BMI, BMR, body fat %, lean mass, fat mass, essential fat, beneficial fat."
      source: "proof-points.md, Output coverage table"
      note: "Always '80+ body measurements', never '80+ body metrics' (terminology-guardrails.md §2.13). BMI/BMR/body composition are calculated metrics/estimates, not measurements."
    - id: FX-006
      text: "Supports: remote intake and body-measurement capture; body composition outputs and Body Progress comparisons; structured data collection for research protocols; structured intake and supporting documentation for customer-managed eligibility workflows; patient/member engagement. Does not independently determine: a diagnosis, treatment, medication recommendation, fitness for duty, employment eligibility, insurance eligibility, clinical-trial eligibility, or any other high-impact individual decision. Final decisions stay with the customer's clinicians, underwriters or other designated decision-makers."
      source: "compliance.md §7, live trust FAQ"
      note: "The canonical 'what FitXpress does not do' boundary block (structure item 7 in about-me.md's 12-part article shape) — load-bearing for a documentation article specifically because it must be clear records support review, they don't replace it."
    - id: FX-007
      text: "FitXpress can support HIPAA-governed deployments where 3DLOOK acts as a business associate under an executed BAA, where applicable."
      source: "compliance.md §1, live trust FAQ"
      note: "Section-first, link to the FAQ, do not restate beyond this line (content-plan guardrail: privacy rows are section-first / link to central FAQ)."
    - id: FX-008
      text: "In most enterprise deployments, the customer acts as the data controller and 3DLOOK acts as the data processor under GDPR."
      source: "compliance.md §2, live trust FAQ — verbatim canonical sentence, do not drop 'the data'"
    - id: FX-009
      text: "Scan records are associated with anonymized, randomly generated IDs; 3DLOOK cannot identify a specific individual from stored scan records."
      source: "compliance.md §4, live trust FAQ"
    - id: FX-010
      text: "3DLOOK's measurement accuracy of approximately 96-97% across body metrics, with a typical absolute error of 1.5-2.0 cm per measurement, varying by body part"
      source: "accuracy-formulations.md §1.1, verbatim from the live framework article"
      note: "SECONDARY claim — only pull this in if the draft actually discusses accuracy (not just documentation/records). Never state without reference/population/protocol condition and a link to the framework article. Two benchmarks never combined in one paragraph."
    - id: FX-011
      text: "For most evaluated measurements, repeated scans showed typical scan-to-scan differences of less than 1 cm"
      source: "accuracy-formulations.md §1.2, the approved repeatability formulation"
      note: "SECONDARY claim — relevant only if the piece touches longitudinal/repeat-scan record-keeping. Write as '< 1 cm' / 'below 1 cm', locked convention."
    - id: FX-012
      text: "FitXpress was not specifically trained on data representing people with physical disabilities, and its measurement performance has not been established for this population. This matters when a disability affects the standard standing pose or capture sequence. In those cases, the program needs a documented alternative measurement path."
      source: "accuracy-formulations.md §5 'Population limitation' (verbatim); proof-points.md Dataset table row 'Population not established'. Approved for publication by Vadim 2026-09-11 (editor's final of the occupational-health intake article)."
      note: "Added by coordinator 2026-09-21 at edit stage: seo-editor placed it in the pilot-design section (the third sentence fits a workflow article per §5's own usage note). Carries no figures."

